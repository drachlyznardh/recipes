<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title></title>

		<script src="./external/jquery-4.0.0.min.js"></script>
		<script src="./external/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
		<link rel="stylesheet" href="./external/jquery-ui-1.14.2.custom/jquery-ui.css" />

		<link rel="stylesheet" href="./style.css" />

		<script src="./constants.js"></script>
		<script src="./globals.js"></script>
		<script src="./data.js"></script>
		<script src="./engine.js"></script>
	</head><body>
		<div class="main">
			<div class="topbar bigbox">
				<div class="float_left">
					<div class="controlgroup">
						<select class="scenario" id="scenario" name="scenario"></select>
						<input type="button" name="reset" value="Reset" onclick="reset()" />
					</div>
					<input type="button" name="pause" value="Pause" onclick="pause()" />
					<input type="button" name="resume" value="Resume" onclick="resume()" />
				</div><div class="float_right controlgroup">
					<input type="button" id="profile" title="profile" />
					<input type="button" id="points" title="points" />
				</div><div class="clear">
				</div>
			</div><div class="board hidden">
				<div class="resources_display float_left bigbox"></div>
				<div class="recipes_display float_left bigbox"></div>
				<div class="clear"></div>
			</div><div class="bottombar bigbox">
				<input type="button" class="victory condition float_left hidden" />
				<div class="controlgroup float_right">
					<input type="button" class="chat" title="chat" />
					<input type="button" class="version" title="About this version" />
				</div>
				<div class="chat float_right"></div>
				<div class="clear"></div>
			</div>
		</div>
		<div class="victory recap popup modal noopen noresize" />
		<div class="about popup modal noopen noresize" />
	</body>
</html>
