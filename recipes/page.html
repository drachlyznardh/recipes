<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title></title>

		<script src="../external/jquery-4.0.0.min.js"></script>
		<script src="../external/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
		<link rel="stylesheet" href="../external/jquery-ui-1.14.2.custom/jquery-ui.css" />

		<link rel="stylesheet" href="../style.css" />

		<script src="../constants.js"></script>
		<script src="../globals.js"></script>
		<script src="./data.js"></script>
		<script src="./engine.js"></script>
	</head><body>
		<div class="main">
			<div class="resources"></div>
		</div>

		<div class="ui-widget ui-widget-content ui-corner-all">
			<div class="ui-widget-header ui-corner-all">
				<div>Recipes</div>
				<div class="float_right controlgroup">
					<input type="button" value="Recipes" disabled />
					<input type="button" value="" disabled />
					<input type="button" value="Recipes" disabled />
					<input type="button" value="" disabled />
					<input type="button" value="X" />
					<input type="button" value="Y" />
					<input type="button" value="Z" />
				</div>
				<div class="clear"></div>
			</div>
			<div class="recipes filter">
				<div style="width: 90%; margin: auto" class="ui-widget-content ui-corner-bottom">
					<div class="controlgroup search">
						<button><span class="ui-icon ui-icon-search"></span></button>
						<input type="text" placeholder="search" />
						<input type="button" value="clear" />
					</div>
				</div>
			</div>
			<div class="recipes sortable"></div>
			<div class="clear"></div>
		</div>

		<div style="display: grid; grid-template-columns: 1fr 2fr; padding: 10px; gap: 10px; background-color: blue; grid-template-areas: 'header header' 'resources recipes' 'footer footer';">
			<div class="ui-widget ui-widget-content ui-corner-all" style="grid-area: header">Header</div>
			<div class="ui-widget ui-widget-content ui-corner-all" style="grid-area: resources">Resources</div>
			<div class="ui-widget ui-widget-content ui-corner-all" style="grid-area: recipes">Recipes</div>
			<div class="ui-widget ui-widget-content ui-corner-all" style="grid-area: footer">Footer</div>
		</div>
	</body>
</html>
