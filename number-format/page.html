<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title></title>

		<script src="../external/jquery-4.0.0.min.js"></script>
		<script src="../external/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
		<link rel="stylesheet" href="../external/jquery-ui-1.14.2.custom/jquery-ui.css" />

		<script src="./common/formatting.js"></script>
		<script type="text/javascript">

const FPS = 10;
const PREFIXES = 'K M B T Qa Qi Sx Sp Oc No De'.split(' ');

var value = 0;
var increment = 1; // .01;
var round = 0;

function nextStep() {
	setTimeout(step, 1000 / FPS);
}

function setup() {
	function mp12(v) { return [v - 2, v - 1, v, v + 1, v + 2]; }
	function dm12(v) { return [v * .99, v * .999, v, v * 1.01, v * 1.1]; }
	var values = [-2, -1, 0, .01, .1] //
		.concat(Array.from(Array(22)).map((e, i) => i + 1)) //
		.concat(Array.from(Array(4)).map((e, i) => 10 ** (i + 2)).map(mp12).flat()) //
		.concat(Array.from(Array(9)).map((e, i) => 10 ** (i + 6)).map(dm12).flat()) //
		.concat(Array.from(Array(8)).map((e, i) => 10 ** (3 * (i + 5)))) //
		.concat(Array.from(Array(11)).map((e, i) => 10 ** 33 * (9990 + i)));
	$('#value3').html(values.map(format).map(v => `<li>${v}</li>`));
}

function step() {
	round++;
	// if (round % 10 == 9) increment *= 1.1;
	increment *= 1.1;
	value += increment;

	$('#value').html(`Value: ${format(value)} (${value})`);
	$('#value2').html(`Increment: ${format(increment)} (${increment})`);
	// $('#value3').html(value.toPrecision(3));
	//  $('#value4').html(value.toPrecision(4));

	nextStep();
}

$(setup);
$(nextStep);
		</script>
	</head><body>
		<ul id="value"></ul>
		<ul id="value2"></ul>
		<ul id="value3"></ul>
		<ul id="value4"></ul>
	</body>
</html>
