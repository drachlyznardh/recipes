<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title></title>

		<script src="../external/jquery-4.0.0.min.js"></script>
		<script src="../external/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
		<link rel="stylesheet" href="../external/jquery-ui-1.14.2.custom/jquery-ui.css" />

		<script type="text/javascript">
const FPS = 10;
const PREFIXES = 'K M B T Qa Qi Sx Sp Oc No De'.split(' ');

var value = 0;
var increment = .01;
var round = 0;

function format(v) {
	const o = Math.floor(Math.floor(Math.log10(v)) / 3);
	if (o == 0) return v.toString();
	const p = PREFIXES[o - 1] || '';
	const d = 10 ** (3 * o);
	const e = v/d;
	const f = 10 ** (2 - Math.floor(Math.log10(e)));
	return `${Math.floor(e * f) / f}${p}`;
}

function nextStep() {
	setTimeout(step, 1000 / FPS);
}

function step() {
	function mp12(v) { return [v - 2, v - 1, v, v + 1, v + 2]; }
	function dm12(v) { return [v * .99, v * .999, v, v * 1.01, v * 1.1]; }
	var values = [1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 18, 19, 20] //
		.concat(Array.from(Array(4)).map((e, i) => 10 ** (i + 2)).map(mp12).flat()) //
		.concat(Array.from(Array(9)).map((e, i) => 10 ** (i + 6)).map(dm12).flat()) //
		.concat(Array.from(Array(7)).map((e, i) => 10 ** (3 * (i + 5)))); //
	$('#value').html(values.map(v => $(`<li>${v} => ${format(v)}</li>`)));

	return;

	round++;
	if (round % 100 == 99) increment *= 11;
	value += increment;

	$('#value').html(f(value));
	$('#value2').html(value.toPrecision(2));
	$('#value3').html(value.toPrecision(3));
	$('#value4').html(value.toPrecision(4));

	nextStep();
}

$(nextStep);
		</script>
	</head><body>
		<ul id="value"></ul>
		<div id="value2"></div>
		<div id="value3"></div>
		<div id="value4"></div>
	</body>
</html>
