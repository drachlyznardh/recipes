<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title></title>

		<script src="../external/jquery-4.0.0.min.js"></script>
		<script src="../external/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
		<link rel="stylesheet" href="../external/jquery-ui-1.14.2.custom/jquery-ui.css" />

		<script type="text/javascript">
const FPS = 10;
const PREFIXES = 'K M B T Qa Qi Sx Sp Oc No De'.split(' ');

var value = 0;
var increment = .01;
var round = 0;

function format(v) {
	const o = Math.floor(Math.floor(Math.log10(v)) / 3);
	const p = PREFIXES[o - 1] || '';
	const d = 10 ** (3 * o);
	return o == 0 //
		? v.toString()
		// : ((e) => `${e}${p}`)(v/d);
		: ((e) => ((b, e) => (`${Math.floor(e / b) * b}${p}`))(Math.floor(Math.log10(e)), e))(v/d);
}

function nextStep() {
	setTimeout(step, 1000 / FPS);
}

function step() {
	function f(v) { return [v * .999, v - 1, v, v + 1, v * 1.01]; }
	var values = [1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 18, 19, 20,
		98, 99, 100, 101,
		498, 499, 500, 501, 502,
		998, 999, 1000, 1001,
		9998, 9999, 10000, 10100,
	].concat([
		100000,
		1000000,
		10000000,
		100000000,
		1000000000,
		10000000000,
		100000000000,
	].map(f).flat());
	// $('#value').html(values.map(format).map($));
	$('#value').html(values.map(v => $(`<li>${v} => ${format(v)}</li>`)));

	return;

	round++;
	if (round % 100 == 99) increment *= 11;
	value += increment;

	$('#value').html(f(value));
	$('#value2').html(value.toPrecision(2));
	$('#value3').html(value.toPrecision(3));
	$('#value4').html(value.toPrecision(4));

	nextStep();
}

$(nextStep);
		</script>
	</head><body>
		<ul id="value"></ul>
		<div id="value2"></div>
		<div id="value3"></div>
		<div id="value4"></div>
	</body>
</html>
